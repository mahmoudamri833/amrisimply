name: TEST alerte (fichier temporaire)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Simuler un probleme
        run: |
          echo "- Test volontaire du systeme d alerte (aucun probleme reel sur le site)." > rapport.txt
          exit 1
      - name: Ouvrir une alerte si probleme
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TEST du systeme d alerte" --body-file rapport.txt
