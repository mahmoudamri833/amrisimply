name: Garder le depot actif

on:
  schedule:
    - cron: '0 6 * * 4'   # tous les jeudis 06:00 UTC (08:00 Bruxelles)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ecrire un marqueur et le commiter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" depot
          cd depot
          mkdir -p .github
          date -u '+Depot maintenu actif le %d/%m/%Y a %H:%M UTC' > .github/derniere-activite.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/derniere-activite.txt
          git commit -m "Maintien de l activite du depot ($(date -u '+%d/%m/%Y'))" || exit 0
          git push
