# Configuration de deploiement Netlify pour amrisimply.com
#
# Le depot contient a la fois le site public et des dossiers prives :
# le livre (produit vendable), les outils, les workflows, les sources.
# On ne publie donc pas la racine : la commande recopie uniquement les
# fichiers du site dans _site/, et c'est _site/ qui part en ligne.
#
# Consequence importante : le dossier livre/ n'est JAMAIS publie. Le guide
# reste un produit, pas un fichier gratuit accessible a tous.
#
# Toute nouvelle page ajoutee a la racine est reprise automatiquement :
# la commande copie tout, sauf la liste d'exclusions ci-dessous.
#
# tar est utilise plutot que rsync : il est present sur toutes les images
# de build, rsync non.

[build]
  publish = "_site"
  command = """
    rm -rf _site && mkdir -p _site && \
    tar --exclude='./.git' \
        --exclude='./.github' \
        --exclude='./livre' \
        --exclude='./outils' \
        --exclude='./_site' \
        --exclude='./netlify.toml' \
        --exclude='./README.md' \
        --exclude='./produits.json' \
        -cf - . | (cd _site && tar -xf -) && \
    echo '--- Fichiers publies ---' && find _site -type f | sort
  """

# Le site est aussi servi sur amrisimply.netlify.app, qui renvoie un 200 avec
# un contenu identique. Le canonical limite le risque, mais Google peut
# crawler et parfois indexer ce doublon. On force donc une redirection 301
# permanente vers le domaine principal, pour toutes les URLs.
#
# force = true est indispensable : sans lui, Netlify sert le fichier statique
# existant et n'applique jamais la redirection.

[[redirects]]
  from = "https://amrisimply.netlify.app/*"
  to = "https://amrisimply.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://amrisimply.netlify.app/*"
  to = "https://amrisimply.com/:splat"
  status = 301
  force = true

# Cache court sur /assets/ : les fichiers n'ont pas de nom versionne
# (pas de hash dans le nom), donc un cache d'un an figerait chaque bug
# chez les visiteurs deja venus. Une heure suffit, Netlify sert des 304
# via ETag derriere. Si un jour un build ajoute des noms hashes, on
# pourra remonter a un an. consent.js a deja paye ce piege : il a du
# etre renomme consent-v2.js parce que l'ancien nom etait cache un an.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Les previsualisations de branches ne doivent jamais etre indexees :
# sinon elles font du contenu duplique avec le site principal.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"
